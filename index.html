<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Chess Game</h1>
        </header>
        
        <div class="game-container">
            <div class="game-info">
                <div class="player-info white-player">
                    <h2>White</h2>
                    <div class="captured-pieces white-captured"></div>
                </div>
                
                <div class="game-status">
                    <div class="current-turn">White's Turn</div>
                    <div class="game-message"></div>
                </div>
                
                <div class="player-info black-player">
                    <h2>Black</h2>
                    <div class="captured-pieces black-captured"></div>
                </div>
            </div>
            
            <div class="chessboard-container">
                <div class="board-coordinates rank-coordinates"></div>
                <div class="chessboard-wrapper">
                    <div id="chessboard"></div>
                    <div class="board-coordinates file-coordinates"></div>
                </div>
            </div>
            
            <div class="game-controls">
                <button id="new-game-btn" class="btn">New Game</button>
                <button id="undo-btn" class="btn">Undo Move</button>
                <button id="save-btn" class="btn">Save Game</button>
                <button id="reset-btn" class="btn">Reset</button>
            </div>
        </div>
        
        <div id="promotion-modal" class="modal">
            <div class="modal-content">
                <h3>Choose Promotion</h3>
                <div class="promotion-pieces">
                    <div class="promotion-piece" data-piece="queen"></div>
                    <div class="promotion-piece" data-piece="rook"></div>
                    <div class="promotion-piece" data-piece="bishop"></div>
                    <div class="promotion-piece" data-piece="knight"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/chess.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
